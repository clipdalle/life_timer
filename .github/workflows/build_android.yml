name: LifeTimer App Build

on:
  push:
    branches:
      - main
      - master
      - android
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name'
        required: true
        default: 'First Edition Release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradlew Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeTimer-${{ github.event.inputs.version_name || github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
