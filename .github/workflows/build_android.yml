name: LifeTimer App Build

on:
  push:
    branches:
      - main
      - master
      - android
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name'
        required: true
        default: 'First Edition Release'

jobs:
  build:
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradlew Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare Release Asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LifeTimer-${{ github.event.inputs.version_name || github.ref_name }}.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LifeTimer-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeTimer-${{ github.event.inputs.version_name || github.ref_name }}
          path: LifeTimer-${{ github.event.inputs.version_name || github.ref_name }}.apk
